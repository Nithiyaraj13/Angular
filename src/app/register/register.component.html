<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">&#9670;</div>
      <h1>Create Account</h1>
      <p>Join us today — it's free!</p>
    </div>

    <div class="success-message" *ngIf="successMessage">
      <span>&#10003;</span> {{ successMessage }}
    </div>

    <form #regForm="ngForm" (ngSubmit)="onSubmit()" novalidate *ngIf="!successMessage">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          #usernameField="ngModel"
          required
          minlength="3"
          class="form-control"
          [class.invalid]="usernameField.invalid && usernameField.touched"
          placeholder="Choose a username"
        />
        <span class="error-hint" *ngIf="usernameField.invalid && usernameField.touched">
          Username is required (min 3 characters).
        </span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          #emailField="ngModel"
          required
          email
          class="form-control"
          [class.invalid]="emailField.invalid && emailField.touched"
          placeholder="Enter your email"
        />
        <span class="error-hint" *ngIf="emailField.invalid && emailField.touched">
          A valid email address is required.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          #passwordField="ngModel"
          required
          minlength="6"
          class="form-control"
          [class.invalid]="passwordField.invalid && passwordField.touched"
          placeholder="Choose a password (min 6 chars)"
        />
        <span class="error-hint" *ngIf="passwordField.invalid && passwordField.touched">
          Password is required (min 6 characters).
        </span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          class="form-control"
          [class.invalid]="passwordMismatch"
          placeholder="Repeat your password"
        />
        <span class="error-hint" *ngIf="passwordMismatch">
          Passwords do not match.
        </span>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <span>&#9888;</span> {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="isLoading || regForm.invalid || passwordMismatch"
      >
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading">Creating...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
