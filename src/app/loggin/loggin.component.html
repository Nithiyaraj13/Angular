<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">&#9670;</div>
      <h1>Welcome Back</h1>
      <p>Sign in to your account</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          #usernameField="ngModel"
          required
          minlength="3"
          class="form-control"
          [class.invalid]="usernameField.invalid && usernameField.touched"
          placeholder="Enter your username"
          autocomplete="username"
        />
        <span class="error-hint" *ngIf="usernameField.invalid && usernameField.touched">
          Username is required (min 3 characters).
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          #passwordField="ngModel"
          required
          minlength="6"
          class="form-control"
          [class.invalid]="passwordField.invalid && passwordField.touched"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
        <span class="error-hint" *ngIf="passwordField.invalid && passwordField.touched">
          Password is required (min 6 characters).
        </span>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <span>&#9888;</span> {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading || loginForm.invalid">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Signing in...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create one</a></p>
      <p class="hint">Demo credentials: <strong>admin</strong> / <strong>admin123</strong></p>
    </div>
  </div>
</div>
